name: Deploy site (analytics + build)

on:
  workflow_dispatch:

concurrency:
  group: deploy-kittech-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Cloudflare Web Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-cf-web-analytics.mjs

      - name: Build static site
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ env.PUBLIC_CF_WEB_ANALYTICS_TOKEN || secrets.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_VIEW_KEY: ${{ secrets.STATS_VIEW_KEY }}
        run: |
          node scripts/ensure-stats-kv.mjs
          # Secrets for /api/stats/ (Web Analytics GraphQL + zone fallback)
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CF_API_TOKEN --config wrangler.jsonc
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ACCOUNT_ID --config wrangler.jsonc
          # Same password as src/lib/stats-config.ts (override via repo secret STATS_VIEW_KEY)
          VIEW_KEY="${STATS_VIEW_KEY:-kittech2026}"
          printf '%s' "$VIEW_KEY" | npx wrangler secret put STATS_VIEW_KEY --config wrangler.jsonc
          npm run cf:deploy
